plugins {
    id 'com.android.application'
}

def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.trackstudio.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.trackstudio.app'
        minSdk 26
        targetSdk 34
        versionCode run
        versionName "1.${run}"
    }

    signingConfigs {
        release {
            // ключ сменён 2026-11-03: пароль только в секрете GitHub KEYSTORE_PASS (в файлах его нет)
            storeFile file('../keystore/release2.p12')
            storeType 'pkcs12'
            storePassword System.getenv('KEYSTORE_PASS')
            keyAlias 'trackstudio'
            keyPassword System.getenv('KEYSTORE_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}

name: fetch-ears
# «уши» для проверки звука: модель оценки качества музыки/голоса (Meta Audiobox Aesthetics) → релиз ears-models (качать из сессии, где Hugging Face закрыт)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Скачать с Hugging Face
        run: |
          pip install -q huggingface_hub
          python -c "from huggingface_hub import snapshot_download; p=snapshot_download('facebook/audiobox-aesthetics', local_dir='m'); print(p)"
          ls -la m
      - name: Релиз ears-models
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cd m
          gh release delete ears-models -y -R ${{ github.repository }} 2>/dev/null || true
          gh release create ears-models -R ${{ github.repository }} -t "ears models" -n "Audiobox Aesthetics (Meta) — для проверки звука" $(find . -maxdepth 1 -type f ! -name '.*' -printf '%f ')

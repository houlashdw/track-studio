name: voxbeat
# бит из пака в Reaper → ACE поёт вокалоид-аниме голос под него → квантизация к сетке 1/16, дебриссинг, цепочка и мастер в Reaper
on:
  workflow_dispatch:
    inputs:
      genre: { default: 'plugg' }
      seed: { default: '1' }
      drums: { default: 'kit' }
      langs: { description: 'языки вокала через пробел (ru ja)', default: 'ru ja' }
      pack: { default: 'pack1' }
      lufs: { description: 'целевая громкость, LUFS по модулю', default: '10' }
      vseed: { default: '5' }
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env: { MODAL_TOKEN_ID: '${{ secrets.MODAL_TOKEN_ID }}', MODAL_TOKEN_SECRET: '${{ secrets.MODAL_TOKEN_SECRET }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Reaper и пак
        run: |
          sudo apt-get -qq update && (sudo apt-get -qq install -y xvfb ffmpeg libgtk-3-0 libasound2t64 >/dev/null || sudo apt-get -qq install -y xvfb ffmpeg libgtk-3-0 libasound2 >/dev/null)
          pip install -q numpy scipy soundfile librosa modal "fastapi[standard]"
          U=$(curl -sL https://www.reaper.fm/download.php | grep -oE 'files/[0-9.x]+/reaper[0-9a-z_]+_linux_x86_64\.tar\.xz' | head -1)
          curl -sL "https://www.reaper.fm/$U" -o /tmp/r.tar.xz && mkdir -p /tmp/rp && tar xf /tmp/r.tar.xz -C /tmp/rp
          D=$(dirname "$(find /tmp/rp -name install-reaper.sh | head -1)"); sudo "$D/install-reaper.sh" --install /opt --quiet || true
          mkdir -p ~/.config/REAPER && printf '[REAPER]\nsplashwnd=0\nverchk=0\n' > ~/.config/REAPER/reaper.ini
          mkdir -p /tmp/pk && modal volume get ts-ace "/pack/${{ inputs.pack }}" /tmp/pk >/dev/null
          P=$(dirname "$(find /tmp/pk -name pack.json | head -1)"); echo "PK=$P" >> $GITHUB_ENV
      - name: Бит → вокал → сведение
        run: |
          mkdir -p /tmp/out; cd $GITHUB_WORKSPACE
          lufs() { ffmpeg -hide_banner -i "$1" -af ebur128 -f null - 2>&1 | grep -A1 "Integrated loudness" | grep -oE "[-0-9.]+ LUFS" | tail -1 | cut -d' ' -f1; }
          render() {   # render <lua> <wav> <target LUFS по модулю> — 2 прохода, громкость подгоняется лимитером
            n=$(basename $1 .lua); MG=0
            for pass in 1 2; do
              rm -f $2 /tmp/out/$n.log
              (TS_PROJ=$1 TS_LOG=/tmp/out/$n.log TS_MGAIN=$MG timeout 240 xvfb-run -a /opt/REAPER/reaper -nosplash -newinst server/reaper/build.lua >/dev/null 2>&1 &)
              for i in $(seq 1 230); do grep -q "РЕНДЕР ГОТОВ" /tmp/out/$n.log 2>/dev/null && break; sleep 1; done; sleep 1; pkill -f /opt/REAPER/reaper || true; pkill Xvfb || true; sleep 1
              [ -f $2 ] || { echo "нет рендера $n"; tail -25 /tmp/out/$n.log; return 1; }
              I=$(lufs $2); echo "$n проход $pass: громкость $I LUFS"
              MG=$(python3 -c "print(round($MG + float('$I') + ${{ inputs.lufs }}, 1))" 2>/dev/null || echo 0)
            done
          }
          g=${{ inputs.genre }}; s=${{ inputs.seed }}
          python3 server/daw/pack.py --pack "$PK" --genre $g --seed $s --drums ${{ inputs.drums }} --smp app/smp --wav /tmp/out/beat.wav --lua /tmp/out/beat.lua --info /tmp/out/info.json
          render /tmp/out/beat.lua /tmp/out/beat.wav ${{ inputs.lufs }}
          ffmpeg -v error -y -i /tmp/out/beat.wav -b:a 192k /tmp/out/beat.mp3
          BPM=$(python3 -c "import json;print(json.load(open('/tmp/out/info.json'))['bpm'])"); LB=$(lufs /tmp/out/beat.wav); echo "бит: $BPM BPM, $LB LUFS"
          for L in ${{ inputs.langs }}; do
            modal run server/modal_ace.py::vocal_for --beat /tmp/out/beat.mp3 --out /tmp/out/vox_raw_$L.mp3 --bpm $BPM --lang $L --seed ${{ inputs.vseed }} 2>&1 | grep -aE "вокал|Error|Traceback" | tail -5
            [ -f /tmp/out/vox_raw_$L.mp3 ] || continue
            python3 server/daw/voxprep.py /tmp/out/vox_raw_$L.mp3 /tmp/out/vox_$L.wav --bpm $BPM
            LV=$(lufs /tmp/out/vox_$L.wav); VV=$(python3 -c "print(round(float('$LB') - 6 - float('$LV'), 1))"); echo "вокал $L: $LV LUFS → стартовый фейдер $VV дБ"
            for it in 1 2 3; do
              python3 server/daw/pack.py --pack "$PK" --genre $g --seed $s --drums ${{ inputs.drums }} --smp app/smp --wav /tmp/out/mix_$L.wav --lua /tmp/out/mix_$L.lua --vox /tmp/out/vox_$L.wav --voxvol $VV
              render /tmp/out/mix_$L.lua /tmp/out/mix_$L.wav ${{ inputs.lufs }} || break
              DV=$(python3 server/daw/balance.py /tmp/out/beat.wav /tmp/out/mix_$L.wav /tmp/out/vox_$L.wav --want 1.5); echo "баланс $L, итерация $it: вокал отличается от цели на $DV дБ (фейдер $VV)"
              python3 -c "import sys; sys.exit(0 if abs(float('$DV')) < 1.0 else 1)" && break
              VV=$(python3 -c "print(round($VV - float('$DV'), 1))")
            done
            # громкость и потолок — финальным шагом (лимитер Reaper на горячем миксе не держит ни то ни другое)
            I=$(lufs /tmp/out/mix_$L.wav); G=$(python3 -c "print(round(-${{ inputs.lufs }} - float('$I'), 2))")
            ffmpeg -v error -y -i /tmp/out/mix_$L.wav -af "volume=${G}dB,alimiter=limit=0.966:attack=3:release=60:level=disabled" -b:a 192k /tmp/out/mix_$L.mp3
            echo "мастер $L: $(lufs /tmp/out/mix_$L.mp3) LUFS"; ffmpeg -hide_banner -i /tmp/out/mix_$L.mp3 -af ebur128=peak=true -f null - 2>&1 | grep -aE "Peak:" | tail -1
            ffmpeg -hide_banner -i /tmp/out/mix_$L.wav -af astats=metadata=0 -f null - 2>&1 | grep -aE "Peak level dB" | head -1
            grep -aE "НЕТ ПЛАГ|нет параметра|не найден" /tmp/out/mix_$L.log | sort | uniq -c | head
          done
          ls /tmp/out
      - name: Выгрузка (шифр открытым ключом)
        if: always()
        run: |
          mkdir -p /tmp/up && cp /tmp/out/*.mp3 /tmp/out/*.log /tmp/out/info.json /tmp/up/ 2>/dev/null || true
          bash tools/enc_out.sh /tmp/up o
          cd o && git init -q -b voxbeat-out && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m vox && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voxbeat-out

name: train-renri
# обучение RVC «Renri по-русски» на процессоре GitHub (без Colab). Результат — ветка ru-pack (файлы для приложения)
on:
  workflow_dispatch:
    inputs:
      seconds: { description: 'секунд на обучение', default: '16200' }
      batch: { description: 'batch', default: '2' }
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Зависимости
        run: |
          free -m; nproc
          pip install -q torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "numpy<2" scipy soundfile librosa transformers onnx onnxruntime tensorboard matplotlib
      - name: RVC 2.2 + правки
        run: |
          git clone -q --depth 1 --branch 2.2.231006 https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI.git rvc
          cd rvc
          sed -i 's/                x = flow(x, x_mask, g=g, reverse=reverse)/                x, _ = flow(x, x_mask, g=g, reverse=reverse)/' infer/lib/infer_pack/models_onnx.py
          sed -i 's/np.fromstring(fig.canvas.tostring_rgb(), dtype=np.uint8, sep="")/np.asarray(fig.canvas.buffer_rgba())[:, :, :3].copy().reshape(-1)/' infer/lib/train/utils.py
          sed -i 's/        num_workers=4,/        num_workers=int(os.environ.get("RVC_WORKERS", "4")),/; s/        prefetch_factor=8,/        prefetch_factor=int(os.environ.get("RVC_PREFETCH", "8")),/' infer/modules/train/train.py
          sed -i 's/        logger.warning("NO GPU DETECTED: falling back to CPU - this may take a while")/        print("CPU")/' infer/modules/train/train.py
          mkdir -p assets/pretrained_v2 assets/rmvpe assets/weights
          HF=https://huggingface.co/lj1995/VoiceConversionWebUI/resolve/main
          wget -q -O assets/pretrained_v2/f0G40k.pth $HF/pretrained_v2/f0G40k.pth
          wget -q -O assets/pretrained_v2/f0D40k.pth $HF/pretrained_v2/f0D40k.pth
          wget -q -O assets/rmvpe/rmvpe.pt $HF/rmvpe.pt
          cp ../colab/renri_rvc.py ../colab/onnx_half.py ../colab/demo_ids.json .
          mkdir -p /tmp/piper && cd /tmp/piper && wget -q https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-ru-irinia-medium.tar.gz && tar xzf voice-ru-irinia-medium.tar.gz
      - name: Подготовка данных
        working-directory: rvc
        run: |
          mkdir -p /tmp/ds && unzip -q ../colab/data/renri_dataset.zip -d /tmp/ds
          python renri_rvc.py prep /tmp/ds
          python renri_rvc.py f0
          python renri_rvc.py feat
      - name: Обучение
        working-directory: rvc
        run: |
          (while true; do sleep 300; free -m | sed -n 2p; done) &
          RVC_WORKERS=1 RVC_PREFETCH=2 LOG_INTERVAL=20 SAVE_EVERY=1 TRAIN_SECONDS=${{ inputs.seconds }} python -u renri_rvc.py train 1000 ${{ inputs.batch }} 2>&1 | grep --line-buffered -vE "Warning|warn\(|return_complex|_VF.stft|torch.load\(|autocast\(|read\(full_path\)|WeightNorm|GradScaler"
      - name: Экспорт, проверка, пак
        working-directory: rvc
        run: |
          python renri_rvc.py export
          python renri_rvc.py check
          python renri_rvc.py demo /tmp/piper demo_ids.json
          python -c "import renri_rvc as r,glob; r.piper_force_fn()([f for f in glob.glob('/tmp/piper/*.onnx')][0], 'out/ru.onnx')"
          cp /tmp/piper/*.onnx.json out/ru.onnx.json
          ls -la out
      - name: Ветка ru-pack
        working-directory: rvc/out
        run: |
          rm -f contentvec_f32.onnx ru_force.onnx
          git init -q -b ru-pack && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          echo "run ${{ github.run_number }} · ${{ inputs.seconds }} с · batch ${{ inputs.batch }}" > STATUS.txt
          git add -A && git commit -q -m "ru-pack ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ru-pack

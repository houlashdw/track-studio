name: kaggle
# запуск скрипта из репо на бесплатной видеокарте Kaggle (API: секреты KAGGLE_USERNAME / KAGGLE_KEY), ожидание, результаты — зашифрованы в ветку kaggle-out
on:
  workflow_dispatch:
    inputs:
      script: { description: 'скрипт в репо', default: 'colab/kaggle_ace_lego.py' }
      slug: { description: 'имя ноутбука на Kaggle', default: 'ts-lego' }
      gpu: { description: 'NvidiaTeslaT4 / NvidiaTeslaP100', default: 'NvidiaTeslaT4' }
      wait: { description: 'ждать минут', default: '330' }
      data: { description: 'датасеты Kaggle через запятую (user/slug)', default: '' }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Kaggle API
        env: { KU: '${{ secrets.KAGGLE_USERNAME }}', KK: '${{ secrets.KAGGLE_KEY }}' }
        run: |
          [ -n "$KU" ] && [ -n "$KK" ] || { echo "::error::нет секретов KAGGLE_USERNAME / KAGGLE_KEY"; exit 1; }
          pip install -q -U kaggle
          echo "KAGGLE_USERNAME=$KU" >> $GITHUB_ENV; echo "KAGGLE_KEY=$KK" >> $GITHUB_ENV
          case "$KK" in KGAT*) echo "KAGGLE_API_TOKEN=$KK" >> $GITHUB_ENV;; esac
      - name: Отправка ноутбука
        run: |
          mkdir k && cp "${{ inputs.script }}" k/main.py
          python - <<'PY'
          import json, os
          json.dump({'id': os.environ['KAGGLE_USERNAME'] + '/${{ inputs.slug }}', 'title': '${{ inputs.slug }}', 'code_file': 'main.py', 'language': 'python',
                     'kernel_type': 'script', 'is_private': True, 'enable_gpu': True, 'enable_internet': True, 'accelerator': '${{ inputs.gpu }}',
                     'dataset_sources': [x for x in '${{ inputs.data }}'.split(',') if x], 'competition_sources': [], 'kernel_sources': []}, open('k/kernel-metadata.json', 'w'))
          PY
          (kaggle kernels push -p k --accelerator "${{ inputs.gpu }}" || kaggle kernels push -p k) | tee push.txt
          K=$(grep -o "kaggle.com/code/[^ ]*" push.txt | head -1 | sed "s#kaggle.com/code/##"); [ -n "$K" ] || K="$(echo $KAGGLE_USERNAME | tr A-Z a-z)/${{ inputs.slug }}"; echo "KREF=$K" >> $GITHUB_ENV; echo "ноутбук: $K"
      - name: Ожидание
        run: |
          K="$KREF"; end=$(( $(date +%s) + ${{ inputs.wait }} * 60 ))
          sleep 60
          while [ $(date +%s) -lt $end ]; do
            s=$(kaggle kernels status "$K" 2>&1 | tail -1); echo "$(date +%T) $s"
            case "$s" in *denied*) ;; *COMPLETE*|*complete*|*ERROR*|*CANCEL*|*cancel*) break;; esac
            sleep 60
          done
      - name: Результаты
        env: { P: '${{ secrets.KEYSTORE_PASS }}' }
        run: |
          K="$KREF"; mkdir -p raw out
          kaggle kernels output "$K" -p raw || true
          ls -la raw
          tail -c 6000 raw/*.log 2>/dev/null | tr -d '\r' | tail -60 || true
          cd raw && for f in *; do [ -f "$f" ] && openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$f" -out "../out/$f.enc" -pass env:P; done; cd ../out
          git init -q -b kaggle-out && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "kaggle ${{ inputs.slug }} ${{ github.run_number }}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kaggle-out

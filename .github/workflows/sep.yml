name: sep
# разделение треков на голос/музыку (Demucs htdemucs): вход — зашифрованные *.mp3.enc в папке ветки vprep-in, выход — зашифрованный голос в ветку sep-out
on:
  workflow_dispatch:
    inputs:
      dir: { description: 'папка в vprep-in', default: 'sep_in' }
permissions:
  contents: write
jobs:
  sep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: vprep-in, path: in }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Demucs
        env: { P: '${{ secrets.KEYSTORE_PASS }}' }
        run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q demucs soundfile "numpy<2"
          mkdir -p a out
          for f in in/${{ inputs.dir }}/*.mp3.enc; do b=$(basename "$f" .enc); openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$f" -out "a/$b" -pass env:P; done
          python -m demucs --two-stems=vocals -n htdemucs --mp3 --mp3-bitrate 256 -o sep a/*.mp3
          for d in sep/htdemucs/*/; do n=$(basename "$d"); for s in vocals no_vocals; do openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$d/$s.mp3" -out "out/${n}__$s.mp3.enc" -pass env:P; done; done
          ls -la out
      - name: Ветка sep-out
        working-directory: out
        run: |
          git init -q -b sep-out && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "sep ${{ github.run_number }}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sep-out

name: modal
# Modal: проверка токена / деплой сервера ACE (секреты MODAL_TOKEN_ID / MODAL_TOKEN_SECRET)
on:
  workflow_dispatch:
    inputs:
      cold2: { description: 'legotest: второй прогон после сна', default: '0' }
      cmd: { description: 'check / deploy / run / http / styles / legotest / atl / instr', default: 'check' }
      file: { default: 'server/modal_ace.py' }
      adapter: { description: 'файл адаптера в ветке voice-ace (зашифр.)', default: '' }
      adname: { description: 'папка в томе: turbo/e100, base/e75', default: 'turbo/e100' }
      ksrc: { description: 'train: ноутбук Kaggle с данными (ds/*.mp3 + dataset.json)', default: 'emethscacute/ts-beatprep2' }
      tenv: { description: 'train: переменные обучения', default: '' }
permissions:
  contents: write
jobs:
  m:
    runs-on: ubuntu-latest
    env: { MODAL_TOKEN_ID: '${{ secrets.MODAL_TOKEN_ID }}', MODAL_TOKEN_SECRET: '${{ secrets.MODAL_TOKEN_SECRET }}' }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q -U modal fastapi
      - name: Проверка
        if: inputs.cmd == 'check'
        run: |
          [ -n "$MODAL_TOKEN_ID" ] && [ -n "$MODAL_TOKEN_SECRET" ] || { echo "::error::нет секретов MODAL_TOKEN_ID / MODAL_TOKEN_SECRET"; exit 1; }
          modal app list 2>&1 | tail -5
          echo OK
      - name: Ключ сервера и голос
        if: inputs.cmd != 'check'
        env: { P: '${{ secrets.KEYSTORE_PASS }}', TSK: '${{ secrets.TS_KEY }}' }
        run: |
          K="$TSK"; [ -n "$K" ] || K=$(printf %s "$P" | sha256sum | cut -c1-32)
          modal secret create ts-key TS_KEY="$K" --force >/dev/null && echo "ключ сервера: задан"
          if [ -n "${{ inputs.adapter }}" ]; then
            git fetch -q origin voice-ace:ko && git show "ko:${{ inputs.adapter }}" > /tmp/a.enc
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in /tmp/a.enc -out /tmp/a.zip -pass env:P && mkdir -p /tmp/ad && cd /tmp/ad && unzip -q /tmp/a.zip
            modal volume create ts-ace 2>/dev/null || true
            modal volume put -f ts-ace /tmp/ad "/adapters/${{ inputs.adname }}" && echo "голос загружен"
          fi
      - name: Бит-адаптер с Kaggle → том Modal
        if: inputs.cmd == 'beatad'
        env: { KAGGLE_USERNAME: '${{ secrets.KAGGLE_USERNAME }}', KAGGLE_KEY: '${{ secrets.KAGGLE_KEY }}' }
        run: |
          pip install -q -U kaggle six; case "$KAGGLE_KEY" in KGAT*) export KAGGLE_API_TOKEN="$KAGGLE_KEY";; esac
          K="${{ inputs.adapter }}"; [ -n "$K" ] || K=emethscacute/ts-beatlora3
          mkdir -p /tmp/ko && kaggle kernels output "$K" -p /tmp/ko --file-pattern '.*\.zip$' >/dev/null || kaggle kernels output "$K" -p /tmp/ko >/dev/null || true
          Z=$(ls -S /tmp/ko/*.zip | head -1); echo "архив: $(basename "$Z") $(du -h "$Z" | cut -f1)"
          mkdir -p /tmp/bz && cd /tmp/bz && unzip -q "$Z"
          C=$(dirname "$(find /tmp/bz -name adapter_config.json | head -1)"); [ -d "$C" ] || C=/tmp/bz; ls -la "$C" | head
          modal volume create ts-ace 2>/dev/null || true
          modal volume rm -r ts-ace /adapters/beat 2>/dev/null || true
          modal volume put -f ts-ace "$C" "/adapters/beat/${{ inputs.adname }}" && echo "бит-адаптер загружен"
      - name: Деплой
        if: inputs.cmd == 'deploy' || inputs.cmd == 'deployatl' || inputs.cmd == 'legotest' || inputs.cmd == 'beatad'
        run: modal deploy "${{ inputs.file }}"
      - name: Запуск
        if: inputs.cmd == 'run'
        env: { P: '${{ secrets.KEYSTORE_PASS }}' }
        run: |
          modal run "${{ inputs.file }}" --out /tmp/test_out.mp3
          mkdir o && openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in /tmp/test_out.mp3 -out o/test_out.mp3.enc -pass env:P && cd o
          git init -q -b modal-out && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "modal test" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" modal-out
      - name: HTTP-проверка (как приложение)
        if: inputs.cmd == 'deploy' || inputs.cmd == 'http'
        env: { P: '${{ secrets.KEYSTORE_PASS }}', TSK: '${{ secrets.TS_KEY }}' }
        run: |
          K="$TSK"; [ -n "$K" ] || K=$(printf %s "$P" | sha256sum | cut -c1-32)
          U=https://fantasydrawingart--track-studio-ace-ace-web.us-east.modal.run
          curl -s -o /dev/null -w "CORS preflight: %{http_code}\n" -X OPTIONS "$U/generate" -H "Origin: https://appassets.androidplatform.net" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type,x-key" --max-time 600
          curl -s -X POST "$U/lyrics" -H "Content-Type: application/json" -H "X-Key: $K" -d '{"caption":"грустная баллада про ночной город, female vocal in Russian","lang":"ru"}' --max-time 900 | python3 -c "import sys,json; d=json.load(sys.stdin); print('ТЕКСТ:', d.get('lyrics','')[:300].replace(chr(10),' / '))" || true
          curl -s -o /dev/null -w "без ключа: %{http_code}\n" -X POST "$U/generate" -H "Content-Type: application/json" -d '{}' --max-time 600
          curl -s -o /tmp/h.mp3 -w "с ключом: %{http_code}, %{size_download} байт, %{time_total} с\n" -X POST "$U/generate" -H "Content-Type: application/json" -H "X-Key: $K" -H "Origin: https://appassets.androidplatform.net" \
            -d '{"caption":"dreamy russian pop, female vocal in Russian","lyrics":"[Verse]\nГород спит, а я не сплю опять\n\n[Chorus]\nМы горим до утра","duration":30,"voice":1}' --max-time 900
      - name: Обучение на Modal (данные с Kaggle → том → L40S)
        if: inputs.cmd == 'train' || inputs.cmd == 'trainget'
        env: { KAGGLE_USERNAME: '${{ secrets.KAGGLE_USERNAME }}', KAGGLE_KEY: '${{ secrets.KAGGLE_KEY }}', P: '${{ secrets.KEYSTORE_PASS }}' }
        run: |
          pip install -q -U kaggle six; case "$KAGGLE_KEY" in KGAT*) export KAGGLE_API_TOKEN="$KAGGLE_KEY";; esac
          S="${{ inputs.ksrc }}"; N="${S#*/}"; O="${{ inputs.adname }}"
          modal volume create ts-ace 2>/dev/null || true
          if ! modal volume ls ts-ace "/data/$N" 2>/dev/null | grep -q dataset.json; then
            mkdir -p /tmp/kin && kaggle kernels output "$S" -p /tmp/kin >/dev/null
            D=$(dirname "$(find /tmp/kin -name dataset.json | head -1)"); echo "данные: $(ls "$D" | wc -l) файлов, $(du -sh "$D" | cut -f1)"
            modal volume put -f ts-ace "$D" "/data/$N"
          fi
          touch /tmp/tr.log; [ "${{ inputs.cmd }}" = trainget ] || modal run server/modal_train.py --src "$N" --out "$O" --env "${{ inputs.tenv }}" > /tmp/tr.log 2>&1 || true; grep -av "%|\|it/s\|B/s" /tmp/tr.log | grep -av "^\s*$" | tail -150
          mkdir -p /tmp/to && modal volume get ts-ace "/train/$O" /tmp/to && bash tools/enc_out.sh /tmp/to o
          cd o && git init -q -b modal-out && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m train && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" modal-out
      - name: Пак из битов (demucs → петли + разметка)
        if: inputs.cmd == 'pack'
        run: modal run server/modal_pack.py ${{ inputs.tenv }} > /tmp/pk.log 2>&1 || true; grep -av "%|\|it/s" /tmp/pk.log | grep -av "^\s*$" | tail -100
      - name: Своя точка входа (ep:<имя>) → mp3 в modal-out
        if: startsWith(inputs.cmd, 'ep:')
        env: { P: '${{ secrets.KEYSTORE_PASS }}' }
        run: |
          E="${{ inputs.cmd }}"; E="${E#ep:}"; mkdir -p /tmp/ep o
          modal run server/modal_ace.py::$E --outdir /tmp/ep 2>&1 | grep -vE "^\s*$|it/s|%\|" | tail -45
          bash tools/enc_out.sh /tmp/ep o
          cd o && git init -q -b modal-out && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m ep && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" modal-out
      - name: Пак лупов → приватный датасет Kaggle (переезд с Modal)
        if: inputs.cmd == 'packexport'
        env: { KU: '${{ secrets.KAGGLE_USERNAME }}', KK: '${{ secrets.KAGGLE_KEY }}' }
        run: |
          pip install -q -U kaggle; export KAGGLE_USERNAME="$KU" KAGGLE_KEY="$KK"; case "$KK" in KGAT*) export KAGGLE_API_TOKEN="$KK";; esac
          mkdir -p pk && modal volume get ts-ace /pack/pack1 pk/ >/dev/null && du -sh pk && find pk -maxdepth 2 | head -5
          D=$(dirname "$(find pk -name pack.json | head -1)"); echo "пак: $D, файлов $(ls "$D" | wc -l)"
          python3 -c "import json,sys; json.dump({'title':'ts-pack1','id':'$KU/ts-pack1','licenses':[{'name':'other'}]}, open(sys.argv[1]+'/dataset-metadata.json','w'))" "$D"
          kaggle datasets create -p "$D" -q 2>&1 | tail -2 || true
          kaggle datasets status "$KU/ts-pack1" 2>&1 | tail -1
      - name: Ключ для входных данных (свой текст песни шифруется им, расшифровка — только внутри прогона)
        if: inputs.cmd == 'inkey'
        run: |
          umask 077; openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/in.pem 2>/dev/null
          modal volume put --force ts-ace /tmp/in.pem /keys/in.pem
          mkdir -p o && openssl pkey -in /tmp/in.pem -pubout -out o/in_pub.pem && rm -f /tmp/in.pem
          cd o && git init -q -b in-key && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m key && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" in-key
      - name: Проба /track (как приложение)
        if: inputs.cmd == 'tracktest'
        env: { P: '${{ secrets.KEYSTORE_PASS }}', TSK: '${{ secrets.TS_KEY }}', GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}', SEEDS: '${{ inputs.ksrc }}', LYR_ENC: '${{ inputs.tenv }}' }
        run: |
          if [ -n "$LYR_ENC" ]; then umask 077; modal volume get ts-ace /keys/in.pem /tmp/in.pem >/dev/null
            python3 -c "import os,base64,subprocess as S; k,e=os.environ['LYR_ENC'].split(':'); open('/tmp/lk','wb').write(base64.b64decode(k)); open('/tmp/le','wb').write(base64.b64decode(e)); p=S.run(['openssl','pkeyutl','-decrypt','-inkey','/tmp/in.pem','-pkeyopt','rsa_padding_mode:oaep','-in','/tmp/lk'],capture_output=True,check=True).stdout; S.run(['openssl','enc','-d','-aes-256-cbc','-pbkdf2','-iter','200000','-in','/tmp/le','-out','/tmp/lyr.txt','-pass','pass:'+p.decode()],check=True)"
            rm -f /tmp/in.pem /tmp/lk; echo "свой текст: $(wc -l < /tmp/lyr.txt) строк"; fi
          K="$TSK"; [ -n "$K" ] || K=$(printf %s "$P" | sha256sum | cut -c1-32)
          U=https://fantasydrawingart--track-studio-ace-ace-web.us-east.modal.run; mkdir -p o /tmp/tt
          for i in $(seq 1 40); do [ "$(curl -s -L -o /dev/null -w "%{http_code}" "$U/ping" --max-time 200)" = 200 ] && break; sleep 5; done; echo "сервер проснулся"
          T0=$(date +%s)
          one() { S=$1; for a in 1 2 3; do python3 -c "import json,os,sys; d=dict(genre='auto',lang='auto',seed=int(sys.argv[1]),debug=True); f='/tmp/lyr.txt'; d.update(lyrics=open(f).read()) if os.path.exists(f) else 0; print(json.dumps(d))" $S > /tmp/b$S.json; curl -s -o /tmp/r$S.json -X POST "$U/track" -H "Content-Type: application/json" -H "X-Key: $K" -d @/tmp/b$S.json --max-time 120; grep -q '"id"' /tmp/r$S.json && break; sleep 5; done
            ID=$(python3 -c "import json; print(json.load(open('/tmp/r$S.json'))['id'])") || { echo "seed $S: POST не дал id: $(head -c 300 /tmp/r$S.json)"; return; }
            for i in $(seq 1 320); do C=$(curl -s -o /tmp/j$S -w "%{http_code}" "$U/job/$ID" -H "X-Key: $K" --max-time 120 || true); [ "$C" = 202 ] || [ "$C" = 000 ] || break; sleep 4; done; mv /tmp/j$S /tmp/tt/track_s$S.mp3
            echo "seed $S: код $C, $(stat -c %s /tmp/tt/track_s$S.mp3) байт, $(( $(date +%s) - T0 )) с"; }
          [ -n "$SEEDS" ] && [ -z "${SEEDS//[0-9 ]/}" ] || SEEDS="101 102 103"
          for S in $SEEDS; do one $S & done; wait
          mkdir -p /tmp/tt/st; for S in $SEEDS; do rm -rf /tmp/dg; mkdir -p /tmp/dg; for n in beat.mp3 vox_raw.mp3 vox_fx.mp3 mix.log info.json; do modal volume get ts-ace /dbg/s$S/$n /tmp/dg/$n >/dev/null 2>&1; done
            for f in $(find /tmp/dg -type f); do cp "$f" /tmp/tt/st/s${S}_$(basename "$f"); done; done; ls /tmp/tt/st
          if [ -n "$GEMINI_API_KEY" ]; then pip install -q google-genai && python3 tools/listen_track.py /tmp/tt || echo "уши: ошибка"; fi
          bash tools/enc_out.sh /tmp/tt o
          cd o && git init -q -b modal-out && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "track test" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" modal-out
      - name: Проба ИИ-бита (/beat, как приложение)
        if: inputs.cmd == 'beattest'
        env: { P: '${{ secrets.KEYSTORE_PASS }}', TSK: '${{ secrets.TS_KEY }}' }
        run: |
          K="$TSK"; [ -n "$K" ] || K=$(printf %s "$P" | sha256sum | cut -c1-32)
          U=https://fantasydrawingart--track-studio-ace-ace-web.us-east.modal.run; mkdir o
          for i in $(seq 1 40); do [ "$(curl -s -L -o /dev/null -w "%{http_code}" "$U/ping" --max-time 200)" = 200 ] && break; sleep 5; done; echo "сервер проснулся"
          for G in phonk rage plugg trap; do
            curl -s -o /tmp/r.json -w "beat POST: %{http_code}\n" -X POST "$U/beat" -H "Content-Type: application/json" -H "X-Key: $K" -d "{\"genre\":\"$G\",\"duration\":45}" --max-time 600; head -c 300 /tmp/r.json; echo
            ID=$(python3 -c "import json; print(json.load(open('/tmp/r.json'))['id'])") || continue
            for i in $(seq 1 90); do C=$(curl -s -o /tmp/b.mp3 -w "%{http_code}" "$U/job/$ID" -H "X-Key: $K" --max-time 120); [ "$C" = 202 ] || break; sleep 8; done
            echo "$G: код $C, $(stat -c %s /tmp/b.mp3) байт"
            [ "$C" = 200 ] && openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in /tmp/b.mp3 -out o/beat_$G.mp3.enc -pass env:P
          done
          cd o && git init -q -b modal-out && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "beat test" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" modal-out
      - name: Пробы стилей
        if: inputs.cmd == 'styles'
        env: { P: '${{ secrets.KEYSTORE_PASS }}' }
        run: |
          modal run "${{ inputs.file }}::styles" --outdir /tmp/st --voice 1.0
          modal run "${{ inputs.file }}::styles" --outdir /tmp/st --voice 0.0
          mkdir o && for f in /tmp/st/*.mp3; do openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$f" -out "o/$(basename $f).enc" -pass env:P; done && cd o
          git init -q -b modal-out && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "styles" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" modal-out
      - name: Проба lego (наш бит → голос ACE)
        if: inputs.cmd == 'legotest'
        env: { P: '${{ secrets.KEYSTORE_PASS }}', TSK: '${{ secrets.TS_KEY }}' }
        run: |
          K="$TSK"; [ -n "$K" ] || K=$(printf %s "$P" | sha256sum | cut -c1-32)
          U=https://fantasydrawingart--track-studio-ace-ace-web.us-east.modal.run
          git fetch -q origin vprep-in:vi && git show vi:beats/ballad.mp3 > /tmp/b.mp3 && (sudo apt-get -qq install -y ffmpeg >/dev/null) && ffmpeg -v error -y -i /tmp/b.mp3 -t 90 -b:a 128k /tmp/b40.mp3
          for VV in 1 0; do export VV
          python - <<'PY'
          import base64, json
          json.dump({'beat_b64': base64.b64encode(open('/tmp/b40.mp3','rb').read()).decode(), 'caption': 'sad ballad, female vocal in English, young female anime girl voice, high-pitched, cute and bright, feminine, alt J-pop vocal style',
                     'lyrics': '[Verse]\nCity lights are fading in the rain\nI keep calling out your name\n\n[Chorus]\nHold me close until the morning light', 'lang': 'en', 'voice': float(__import__('os').environ.get('VV', '1')), 'seed': 5}, open('/tmp/q.json', 'w'), ensure_ascii=False)
          PY
          t1=$(date +%s); curl -s "$U/ping?warm=lego" --max-time 600; echo " ping $(( $(date +%s) - t1 )) с"
          J=$(curl -s -X POST "$U/lego" -H "Content-Type: application/json" -H "X-Key: $K" --data-binary @/tmp/q.json --max-time 300); echo "задание: $J"
          ID=$(echo "$J" | python -c "import sys,json; print(json.load(sys.stdin)['id'])")
          t0=$(date +%s); while :; do c=$(curl -s -o /tmp/v.mp3 -w "%{http_code}" "$U/job/$ID" -H "X-Key: $K" --max-time 120); [ "$c" = 202 ] || break; sleep 10; done
          echo "итог v$VV: $c, $(stat -c %s /tmp/v.mp3) байт, $(( $(date +%s) - t0 )) с"; mkdir -p o; openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in /tmp/v.mp3 -out o/lego_v$VV.mp3.enc -pass env:P
            if [ "$VV" = 1 ] && [ "${{ inputs.cold2 }}" = 1 ]; then echo "жду 6 мин, чтобы сервер уснул (второй холодный старт — из снимка)"; sleep 400; fi
          done; cd o
          git init -q -b modal-out && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m legotest && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" modal-out
      - name: Atlanta (EN)
        if: inputs.cmd == 'atl' || inputs.cmd == 'deployatl'
        env: { P: '${{ secrets.KEYSTORE_PASS }}', TSK: '${{ secrets.TS_KEY }}' }
        run: |
          K="$TSK"; [ -n "$K" ] || K=$(printf %s "$P" | sha256sum | cut -c1-32)
          U=https://fantasydrawingart--track-studio-ace-ace-web.us-east.modal.run; mkdir -p /tmp/at o
          sudo apt-get -qq install -y ffmpeg >/dev/null; git fetch -q origin vprep-in:vi && git show vi:beats/trap.mp3 > /tmp/t.mp3 && ffmpeg -v error -y -i /tmp/t.mp3 -t 45 -b:a 128k /tmp/t45.mp3
          python - <<'PY'
          import base64, json
          L = "[Intro]\nYeah, uh\n\n[Verse]\nRiding through the city with the windows down\nAll my day ones with me, never let 'em down\nMama told me chase it, now I wear the crown\nCounting up the blessings, I don't make a sound\n\n[Hook]\nUp all night, yeah, I'm cooking up the wave\nNo days off, I been running every day"
          A = 'Atlanta trap, {w} rap vocal in English, melodic rap flow, triplet flow, ad-libs, autotune, hard 808, rolling hi-hats, dark synth melody'
          json.dump({'caption': A.format(w='female'), 'lyrics': L, 'bpm': 140, 'duration': 45, 'voice': 1.0, 'lang': 'en', 'seed': 7}, open('/tmp/at/f.json', 'w'))
          json.dump({'caption': A.format(w='male'), 'lyrics': L, 'bpm': 140, 'duration': 45, 'voice': 0, 'lang': 'en', 'seed': 7}, open('/tmp/at/m.json', 'w'))
          json.dump({'beat_b64': base64.b64encode(open('/tmp/t45.mp3','rb').read()).decode(), 'caption': A.format(w='female'), 'lyrics': L, 'bpm': 140, 'voice': 1.0, 'lang': 'en', 'seed': 7, 'full': True}, open('/tmp/at/lego.json', 'w'))
          PY
          curl -s "$U/ping" --max-time 600; echo
          for n in; do curl -s -o o/atl_ace_$n.mp3 -w "$n: %{http_code} %{size_download} %{time_total}\n" -X POST "$U/generate" -H "Content-Type: application/json" -H "X-Key: $K" --data-binary @/tmp/at/$n.json --max-time 900; done
          ID=$(curl -s -X POST "$U/lego" -H "Content-Type: application/json" -H "X-Key: $K" --data-binary @/tmp/at/lego.json | python -c "import sys,json; print(json.load(sys.stdin)['id'])")
          while :; do c=$(curl -s -o o/atl_lego_full_f.mp3 -w "%{http_code}" "$U/job/$ID" -H "X-Key: $K" --max-time 120); [ "$c" = 202 ] || break; sleep 10; done; echo "lego: $c"
          cp /tmp/t45.mp3 o/trap_beat45.mp3
          cd o && for f in *.mp3; do openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$f" -out "$f.enc" -pass env:P && rm "$f"; done
          git init -q -b modal-out && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m atl && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" modal-out
      - name: Учебный набор инструментала (ACE → стемы)
        if: inputs.cmd == 'instr'
        env: { P: '${{ secrets.KEYSTORE_PASS }}' }
        run: |
          modal deploy "${{ inputs.file }}" >/dev/null
          modal run "${{ inputs.file }}::instr" --outdir /tmp/ins --per 4
          cd /tmp/ins && tar cf /tmp/ins.tar . && cd - && mkdir o && openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in /tmp/ins.tar -out o/instr.tar.enc -pass env:P && ls -la o
          cd o && split -b 90m instr.tar.enc instr.tar.enc.part_ && rm instr.tar.enc
          git init -q -b instr-data && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m instr && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" instr-data
      - name: Логи сервера
        if: inputs.cmd == 'logs'
        run: timeout 90 modal app logs track-studio-ace 2>&1 | tail -60 || true

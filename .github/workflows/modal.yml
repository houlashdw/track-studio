name: modal
# Modal: проверка токена / деплой сервера ACE (секреты MODAL_TOKEN_ID / MODAL_TOKEN_SECRET)
on:
  workflow_dispatch:
    inputs:
      cmd: { description: 'check / deploy / run / http / styles / legotest / atl / instr', default: 'check' }
      file: { default: 'server/modal_ace.py' }
      adapter: { description: 'файл адаптера в ветке voice-ace (зашифр.)', default: '' }
      adname: { description: 'папка в томе: turbo/e100, base/e75', default: 'turbo/e100' }
permissions:
  contents: write
jobs:
  m:
    runs-on: ubuntu-latest
    env: { MODAL_TOKEN_ID: '${{ secrets.MODAL_TOKEN_ID }}', MODAL_TOKEN_SECRET: '${{ secrets.MODAL_TOKEN_SECRET }}' }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q -U modal fastapi
      - name: Проверка
        if: inputs.cmd == 'check'
        run: |
          [ -n "$MODAL_TOKEN_ID" ] && [ -n "$MODAL_TOKEN_SECRET" ] || { echo "::error::нет секретов MODAL_TOKEN_ID / MODAL_TOKEN_SECRET"; exit 1; }
          modal app list 2>&1 | tail -5
          echo OK
      - name: Ключ сервера и голос
        if: inputs.cmd != 'check'
        env: { P: '${{ secrets.KEYSTORE_PASS }}', TSK: '${{ secrets.TS_KEY }}' }
        run: |
          K="$TSK"; [ -n "$K" ] || K=$(printf %s "$P" | sha256sum | cut -c1-32)
          modal secret create ts-key TS_KEY="$K" --force >/dev/null && echo "ключ сервера: задан"
          if [ -n "${{ inputs.adapter }}" ]; then
            git fetch -q origin voice-ace:ko && git show "ko:${{ inputs.adapter }}" > /tmp/a.enc
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in /tmp/a.enc -out /tmp/a.zip -pass env:P && mkdir -p /tmp/ad && cd /tmp/ad && unzip -q /tmp/a.zip
            modal volume create ts-ace 2>/dev/null || true
            modal volume put -f ts-ace /tmp/ad "/adapters/${{ inputs.adname }}" && echo "голос загружен"
          fi
      - name: Деплой
        if: inputs.cmd == 'deploy' || inputs.cmd == 'deployatl'
        run: modal deploy "${{ inputs.file }}"
      - name: Запуск
        if: inputs.cmd == 'run'
        env: { P: '${{ secrets.KEYSTORE_PASS }}' }
        run: |
          modal run "${{ inputs.file }}" --out /tmp/test_out.mp3
          mkdir o && openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in /tmp/test_out.mp3 -out o/test_out.mp3.enc -pass env:P && cd o
          git init -q -b modal-out && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "modal test" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" modal-out
      - name: HTTP-проверка (как приложение)
        if: inputs.cmd == 'deploy' || inputs.cmd == 'http'
        env: { P: '${{ secrets.KEYSTORE_PASS }}', TSK: '${{ secrets.TS_KEY }}' }
        run: |
          K="$TSK"; [ -n "$K" ] || K=$(printf %s "$P" | sha256sum | cut -c1-32)
          U=https://fantasydrawingart--track-studio-ace-ace-web.us-east.modal.run
          curl -s -o /dev/null -w "CORS preflight: %{http_code}\n" -X OPTIONS "$U/generate" -H "Origin: https://appassets.androidplatform.net" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type,x-key" --max-time 600
          curl -s -o /dev/null -w "без ключа: %{http_code}\n" -X POST "$U/generate" -H "Content-Type: application/json" -d '{}' --max-time 600
          curl -s -o /tmp/h.mp3 -w "с ключом: %{http_code}, %{size_download} байт, %{time_total} с\n" -X POST "$U/generate" -H "Content-Type: application/json" -H "X-Key: $K" -H "Origin: https://appassets.androidplatform.net" \
            -d '{"caption":"dreamy russian pop, female vocal in Russian","lyrics":"[Verse]\nГород спит, а я не сплю опять\n\n[Chorus]\nМы горим до утра","duration":30,"voice":1}' --max-time 900
      - name: Пробы стилей
        if: inputs.cmd == 'styles'
        env: { P: '${{ secrets.KEYSTORE_PASS }}' }
        run: |
          modal run "${{ inputs.file }}::styles" --outdir /tmp/st --voice 1.0
          modal run "${{ inputs.file }}::styles" --outdir /tmp/st --voice 0.0
          mkdir o && for f in /tmp/st/*.mp3; do openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$f" -out "o/$(basename $f).enc" -pass env:P; done && cd o
          git init -q -b modal-out && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "styles" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" modal-out
      - name: Проба lego (наш бит → голос ACE)
        if: inputs.cmd == 'legotest'
        env: { P: '${{ secrets.KEYSTORE_PASS }}', TSK: '${{ secrets.TS_KEY }}' }
        run: |
          K="$TSK"; [ -n "$K" ] || K=$(printf %s "$P" | sha256sum | cut -c1-32)
          U=https://fantasydrawingart--track-studio-ace-ace-web.us-east.modal.run
          git fetch -q origin vprep-in:vi && git show vi:beats/ballad.mp3 > /tmp/b.mp3 && (sudo apt-get -qq install -y ffmpeg >/dev/null) && ffmpeg -v error -y -i /tmp/b.mp3 -t 40 -b:a 128k /tmp/b40.mp3
          python - <<'PY'
          import base64, json
          json.dump({'beat_b64': base64.b64encode(open('/tmp/b40.mp3','rb').read()).decode(), 'caption': 'sad russian ballad, soft intimate female vocal in Russian',
                     'lyrics': '[Verse]\nГород спит, а я не сплю опять\nЗвёзды падают в мою тетрадь\n\n[Chorus]\nМы горим, мы горим до утра', 'voice': 1.0, 'seed': 5}, open('/tmp/q.json', 'w'), ensure_ascii=False)
          PY
          curl -s -X POST "$U/ping" -o /dev/null; curl -s "$U/ping" --max-time 600; echo
          J=$(curl -s -X POST "$U/lego" -H "Content-Type: application/json" -H "X-Key: $K" --data-binary @/tmp/q.json --max-time 300); echo "задание: $J"
          ID=$(echo "$J" | python -c "import sys,json; print(json.load(sys.stdin)['id'])")
          t0=$(date +%s); while :; do c=$(curl -s -o /tmp/v.mp3 -w "%{http_code}" "$U/job/$ID" -H "X-Key: $K" --max-time 120); [ "$c" = 202 ] || break; sleep 10; done
          echo "итог: $c, $(stat -c %s /tmp/v.mp3) байт, $(( $(date +%s) - t0 )) с"; head -c 300 /tmp/v.mp3 | grep -a detail || true
          mkdir o && openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in /tmp/v.mp3 -out o/lego_vocals.mp3.enc -pass env:P && cd o
          git init -q -b modal-out && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m legotest && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" modal-out
      - name: Atlanta (EN)
        if: inputs.cmd == 'atl' || inputs.cmd == 'deployatl'
        env: { P: '${{ secrets.KEYSTORE_PASS }}', TSK: '${{ secrets.TS_KEY }}' }
        run: |
          K="$TSK"; [ -n "$K" ] || K=$(printf %s "$P" | sha256sum | cut -c1-32)
          U=https://fantasydrawingart--track-studio-ace-ace-web.us-east.modal.run; mkdir -p /tmp/at o
          sudo apt-get -qq install -y ffmpeg >/dev/null; git fetch -q origin vprep-in:vi && git show vi:beats/trap.mp3 > /tmp/t.mp3 && ffmpeg -v error -y -i /tmp/t.mp3 -t 45 -b:a 128k /tmp/t45.mp3
          python - <<'PY'
          import base64, json
          L = "[Intro]\nYeah, uh\n\n[Verse]\nRiding through the city with the windows down\nAll my day ones with me, never let 'em down\nMama told me chase it, now I wear the crown\nCounting up the blessings, I don't make a sound\n\n[Hook]\nUp all night, yeah, I'm cooking up the wave\nNo days off, I been running every day"
          A = 'Atlanta trap, {w} rap vocal in English, melodic rap flow, triplet flow, ad-libs, autotune, hard 808, rolling hi-hats, dark synth melody'
          json.dump({'caption': A.format(w='female'), 'lyrics': L, 'bpm': 140, 'duration': 45, 'voice': 1.0, 'lang': 'en', 'seed': 7}, open('/tmp/at/f.json', 'w'))
          json.dump({'caption': A.format(w='male'), 'lyrics': L, 'bpm': 140, 'duration': 45, 'voice': 0, 'lang': 'en', 'seed': 7}, open('/tmp/at/m.json', 'w'))
          json.dump({'beat_b64': base64.b64encode(open('/tmp/t45.mp3','rb').read()).decode(), 'caption': A.format(w='female'), 'lyrics': L, 'bpm': 140, 'voice': 1.0, 'lang': 'en', 'seed': 7, 'full': True}, open('/tmp/at/lego.json', 'w'))
          PY
          curl -s "$U/ping" --max-time 600; echo
          for n in; do curl -s -o o/atl_ace_$n.mp3 -w "$n: %{http_code} %{size_download} %{time_total}\n" -X POST "$U/generate" -H "Content-Type: application/json" -H "X-Key: $K" --data-binary @/tmp/at/$n.json --max-time 900; done
          ID=$(curl -s -X POST "$U/lego" -H "Content-Type: application/json" -H "X-Key: $K" --data-binary @/tmp/at/lego.json | python -c "import sys,json; print(json.load(sys.stdin)['id'])")
          while :; do c=$(curl -s -o o/atl_lego_full_f.mp3 -w "%{http_code}" "$U/job/$ID" -H "X-Key: $K" --max-time 120); [ "$c" = 202 ] || break; sleep 10; done; echo "lego: $c"
          cp /tmp/t45.mp3 o/trap_beat45.mp3
          cd o && for f in *.mp3; do openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$f" -out "$f.enc" -pass env:P && rm "$f"; done
          git init -q -b modal-out && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m atl && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" modal-out
      - name: Учебный набор инструментала (ACE → стемы)
        if: inputs.cmd == 'instr'
        env: { P: '${{ secrets.KEYSTORE_PASS }}' }
        run: |
          modal deploy "${{ inputs.file }}" >/dev/null
          modal run "${{ inputs.file }}::instr" --outdir /tmp/ins --per 4
          cd /tmp/ins && tar cf /tmp/ins.tar . && cd - && mkdir o && openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in /tmp/ins.tar -out o/instr.tar.enc -pass env:P && ls -la o
          cd o && split -b 90m instr.tar.enc instr.tar.enc.part_ && rm instr.tar.enc
          git init -q -b instr-data && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m instr && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" instr-data

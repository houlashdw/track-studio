name: vindex
# индекс голоса для RVC (поиск по примерам): вокал из закрытого кэша vprep → ContentVec int8 (как на телефоне) → k-means → зашифровано → ветка voice-index
on:
  workflow_dispatch:
    inputs:
      vox: { description: 'ключ кэша вокала (vprep)', default: 'vox-42049030730' }
      k: { description: 'центров k-means', default: '3000' }
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: ru-pack, path: rp, lfs: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Зависимости
        run: pip install -q "numpy<2" scipy soundfile librosa onnxruntime scikit-learn
      - uses: actions/cache/restore@v4
        with: { path: /tmp/vox, key: '${{ inputs.vox }}', fail-on-cache-miss: true }
      - name: Признаки и k-means
        run: |
          python - <<'PY'
          import numpy as np, librosa, onnxruntime as ort
          from sklearn.cluster import MiniBatchKMeans
          y, sr = librosa.load('/tmp/vox/vocals.mp3', sr=16000, mono=True)
          H = 800; n = len(y) // H; r = np.sqrt(np.mean(y[:n * H].reshape(n, H) ** 2, 1) + 1e-12)
          on = 20 * np.log10(r / np.percentile(r, 95)) > -28
          so = ort.SessionOptions(); so.intra_op_num_threads = 4
          cv = ort.InferenceSession('rp/contentvec.onnx', so); F = []
          W = 16000 * 10
          for a in range(0, len(y), W):
              x = y[a:a + W].astype(np.float32)
              if len(x) < 8000: break
              f = cv.run(None, {'audio': x[None]})[0][0]           # 50 кадров/с
              m = np.repeat(on[a // H: a // H + len(x) // H], 2)[:len(f)]
              F.append(f[:len(m)][m.astype(bool)])
          F = np.concatenate(F).astype(np.float32); print('кадров голоса', len(F))
          k = min(int('${{ inputs.k }}'), len(F) // 4)
          km = MiniBatchKMeans(n_clusters=k, batch_size=4096, n_init=3, random_state=0).fit(F)
          C = km.cluster_centers_.astype(np.float16); np.save('/tmp/index.npy', C); print('центров', C.shape)
          PY
      - name: Ветка voice-index (зашифровано)
        env: { P: '${{ secrets.KEYSTORE_PASS }}' }
        run: |
          mkdir out && cd out
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in /tmp/index.npy -out index.npy.enc -pass env:P
          echo "vox ${{ inputs.vox }} · k ${{ inputs.k }}" > STATUS.txt
          git init -q -b voice-index && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q -m "voice-index ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voice-index

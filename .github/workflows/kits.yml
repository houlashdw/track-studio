name: kits
# бесплатные драм-киты из интернета → нарезка one-shot'ов (OGG) → зашифровано в ветку kits-out
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Киты
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy soundfile
          python tools/kits/fetch_kits.py kits
      - name: В ветку
        env: { P: '${{ secrets.KEYSTORE_PASS }}' }
        run: |
          tar czf kits.tgz kits && mkdir out && openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in kits.tgz -out out/kits.tgz.enc -pass env:P
          cd out && git init -q -b kits-out && git config user.name gha && git config user.email gha@users.noreply.github.com
          git add -A && git commit -q -m "kits ${{ github.run_number }}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kits-out
